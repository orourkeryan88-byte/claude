<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Talk to our AI receptionist · Bright Smile Dental</title>
<meta name="description" content="Talk to an AI receptionist — it answers, books appointments and never misses a call. A live demo by Southline." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2312805c'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--g:#12805c;--g2:#0f6f50;--ink:#12211b;--mut:#6b7d75;--line:#e3ebe7;--bg:#f4f8f6}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100svh;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:520px;min-height:100svh;display:flex;flex-direction:column;background:#fff}
  header{background:linear-gradient(140deg,var(--g),var(--g2));color:#fff;padding:20px 20px 22px;text-align:center;position:relative}
  header .badge{display:inline-flex;align-items:center;gap:7px;background:#ffffff22;border:1px solid #ffffff33;border-radius:100px;
    padding:5px 12px;font-size:12px;font-weight:700;margin-bottom:12px}
  header .badge .d{width:8px;height:8px;border-radius:50%;background:#7bffcb;animation:pulse 2s infinite}
  header h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
  header p{font-size:13.5px;opacity:.9;margin-top:4px}
  .feed{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:84%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.42}
  .msg.ai{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .msg.me{background:var(--g);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
  .msg .rep{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;color:var(--g);cursor:pointer;font-weight:700}
  .msg.typing{color:var(--mut);font-style:italic}
  .status{text-align:center;font-size:12.5px;color:var(--mut);min-height:18px;padding:2px 16px}
  .dock{padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
  .mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
  .mic{width:78px;height:78px;border-radius:50%;border:none;background:linear-gradient(140deg,var(--g),var(--g2));color:#fff;
    font-size:30px;cursor:pointer;box-shadow:0 12px 30px rgba(18,128,92,.4);transition:.15s;display:grid;place-items:center}
  .mic:active{transform:scale(.94)}
  .mic.on{background:linear-gradient(140deg,#e11d48,#b91c1c);animation:ring 1.3s infinite}
  .mic-label{font-size:13px;color:var(--mut);font-weight:600}
  .row{display:flex;gap:8px;margin-top:12px}
  .row input{flex:1;border:1px solid var(--line);border-radius:100px;padding:12px 16px;font-size:15px;font-family:inherit;outline:none}
  .row input:focus{border-color:var(--g)}
  .row .send{border:none;background:var(--g);color:#fff;border-radius:50%;width:44px;height:44px;font-size:17px;cursor:pointer;flex:none}
  footer{text-align:center;font-size:12px;color:var(--mut);padding:12px}
  footer b{color:var(--g)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(123,255,203,.6)}70%{box-shadow:0 0 0 8px rgba(123,255,203,0)}100%{box-shadow:0 0 0 0 rgba(123,255,203,0)}}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(225,29,72,.5)}70%{box-shadow:0 0 0 16px rgba(225,29,72,0)}100%{box-shadow:0 0 0 0 rgba(225,29,72,0)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge"><span class="d"></span> AI RECEPTIONIST · LIVE DEMO</div>
    <h1>Bright Smile Dental</h1>
    <p>Tap the mic and talk to me — I answer, and I book appointments.</p>
  </header>
  <div class="feed" id="feed"></div>
  <div class="status" id="status"></div>
  <div class="dock">
    <div class="mic-wrap">
      <button class="mic" id="mic" title="Tap to talk">🎤</button>
      <div class="mic-label" id="mic-label">Tap to talk</div>
    </div>
    <div class="row">
      <input id="text" placeholder="…or type a message" />
      <button class="send" id="send" title="Send">➤</button>
    </div>
  </div>
  <footer>Powered by <b>Southline</b> — your business, answered 24/7.</footer>
</div>
<script>
const SERVER = "https://southline-ai-receptionist.onrender.com";
const $ = (id)=>document.getElementById(id);
let history = [], busy = false, recog = null, listening = false, started = false, micWanted = false, speaking = false;

// Personalization: ?biz=Glow+Med+Spa&type=medspa  (types: medspa, salon, tattoo, dental, service)
const params = new URLSearchParams(location.search);
const BIZ  = (params.get('biz') || '').replace(/[^\w\s&'.,\-]/g, '').trim().slice(0, 60) || null;
const TYPE = (params.get('type') || '').toLowerCase().trim() || (BIZ ? 'medspa' : 'dental');
const BIZ_NAME = BIZ || 'Bright Smile Dental';
document.title = 'Talk to our AI receptionist · ' + BIZ_NAME;
document.querySelector('header h1').textContent = BIZ_NAME;

function add(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role==='ai'?'ai':'me');
  d.textContent = text;
  $('feed').appendChild(d); $('feed').scrollTop = $('feed').scrollHeight;
  return d;
}
function greet(){
  if(started) return; started = true;
  add('ai', "Hi, thanks for calling " + BIZ_NAME + " — this is Riley. How can I help you today?");
}
async function send(text){
  text = (text||'').trim();
  if(!text || busy) return;
  greet();
  add('me', text); history.push({role:'user', content:text});
  $('text').value=''; busy = true; $('status').textContent = 'Riley is thinking…';
  const typing = document.createElement('div'); typing.className='msg ai typing'; typing.textContent='…';
  $('feed').appendChild(typing); $('feed').scrollTop = $('feed').scrollHeight;
  try{
    const r = await fetch(SERVER + '/demo-voice', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: history, biz: BIZ, type: TYPE})});
    const data = await r.json();
    typing.remove();
    const reply = data.reply || "Sorry, could you say that once more?";
    const bubble = add('ai', reply); history.push({role:'assistant', content:reply});
    $('status').textContent = '';
    if(data.audio){
      const audio = new Audio(data.audio);
      // Pause the mic while Riley is talking so it doesn't hear itself, then resume.
      audio.onplay  = ()=>{ speaking=true;  if(micWanted){ try{recog.stop();}catch(e){} } };
      audio.onended = ()=>{ speaking=false; resumeMic(); };
      audio.onerror = ()=>{ speaking=false; resumeMic(); };
      const rep = document.createElement('span'); rep.className='rep'; rep.textContent='🔊 replay';
      rep.onclick = ()=>{ audio.currentTime=0; audio.play().catch(()=>{}); };
      bubble.appendChild(document.createElement('br')); bubble.appendChild(rep);
      audio.play().catch(()=>{ $('status').textContent='Tap 🔊 replay to hear it.'; speaking=false; resumeMic(); });
    }
    // Only surface a warning if it's genuinely broken (no voice came back).
    if(!data.audio && data.voice === 'none'){ $('status').textContent = 'Voice not switched on yet (add ElevenLabs key on the server).'; }
    else if(!data.audio && data.diag){ $('status').textContent = '⚠ ' + data.diag; }
  }catch(e){
    typing.remove();
    // Drop the unanswered question from history so the conversation stays in
    // sync — otherwise every later message inherits the broken exchange.
    if(history.length && history[history.length-1].role==='user') history.pop();
    add('ai', "Sorry — I can't reach the line right now. Please try again in a moment.");
    $('status').textContent = '';
  }
  busy = false;
  resumeMic();
}
$('send').onclick = ()=> send($('text').value);
$('text').addEventListener('keydown', e=>{ if(e.key==='Enter') send($('text').value); });

// Voice input (browser speech-to-text). Voice OUTPUT is ElevenLabs from the server.
// Tap ONCE to turn the mic on — it stays listening until you tap it again.
function setMicUI(on){
  listening = on;
  $('mic').classList.toggle('on', on);
  $('mic-label').textContent = on ? 'Listening — tap to stop' : 'Tap to talk';
}
// Bring the mic back no matter what state recognition ended up in. If a plain
// start() fails (stale object after an error), rebuild recognition from scratch
// so the demo never silently goes deaf mid-conversation.
function resumeMic(){
  if(!micWanted || speaking) return;
  try{ recog.start(); }
  catch(e){ try{ startRecog(); }catch(e2){} }
}
function startRecog(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recog = new SR(); recog.lang='en-US'; recog.continuous=true; recog.interimResults=false; recog.maxAlternatives=1;
  recog.onstart = ()=>{ if(!speaking) setMicUI(true); };
  recog.onresult = (e)=>{
    let finalText='';
    for(let i=e.resultIndex; i<e.results.length; i++){ if(e.results[i].isFinal) finalText += e.results[i][0].transcript; }
    finalText = finalText.trim();
    if(finalText) send(finalText);
  };
  recog.onerror = (e)=>{
    if(e && (e.error==='not-allowed' || e.error==='service-not-allowed')){
      micWanted=false; setMicUI(false); $('mic-label').textContent='Allow mic access to talk';
    }
  };
  // Browsers auto-stop on silence — restart so it stays on until the user taps off.
  recog.onend = ()=>{
    if(micWanted && !speaking){ setTimeout(resumeMic, 150); }
    else if(!micWanted){ setMicUI(false); }
  };
  try{ recog.start(); }catch(e){}
}
$('mic').onclick = ()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ $('mic-label').textContent = 'Voice needs Chrome/Safari — type instead'; $('text').focus(); return; }
  greet();
  if(micWanted){ micWanted=false; try{recog.stop();}catch(e){} setMicUI(false); }
  else { micWanted=true; startRecog(); }
};
// Show the greeting as soon as the page opens.
window.addEventListener('load', greet);
// Wake the server the moment the page opens (free hosting sleeps when idle),
// so it's warm before the visitor sends their first message.
fetch(SERVER + '/').catch(()=>{});
</script>
</body>
</html>
