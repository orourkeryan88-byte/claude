services:
  - type: web
    name: southline-ai-receptionist
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node log-lead.js
    envVars:
      - key: PORT
        value: 3000
      - key: DASHBOARD_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DEFAULT_OWNER_PHONE
        sync: false
      - key: TIMEZONE
        value: Europe/Dublin
      - key: OPEN_HOUR
        value: "9"
      - key: CLOSE_HOUR
        value: "17.5"
        # 5:30pm
      - key: SLOT_MINS
        value: "30"
      - key: SETUP_FEE_CENTS
        value: "35000"
      - key: MONTHLY_FEE_CENTS
        value: "8000"
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ACCOUNTS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: VAPI_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SA_EMAIL
        sync: false
      - key: GOOGLE_SA_PRIVATE_KEY
        sync: false
