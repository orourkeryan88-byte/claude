<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Southline AI Receptionist — Web Chat</title>
<style>
  :root{ --brand:#2563eb; --brand2:#0ea5e9; --ink:#0f1b2e; --mut:#6b7a93; --line:#e6eaf2; --bg:#f4f7fc; --good:#10b981; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .widget{display:flex;flex-direction:column;height:100vh;max-width:440px;margin:0 auto;background:#fff;box-shadow:0 0 40px rgba(16,24,40,.08)}
  .wh{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px}
  .wh .av{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px}
  .wh .nm{font-weight:800;font-size:16px}.wh .st{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#a7f3d0;box-shadow:0 0 0 0 rgba(167,243,208,.7);animation:p 2s infinite}
  @keyframes p{70%{box-shadow:0 0 0 7px rgba(167,243,208,0)}100%{box-shadow:0 0 0 0 rgba(167,243,208,0)}}
  .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
  .b{max-width:82%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;animation:in .2s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .b.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
  .b.me{align-self:flex-end;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-bottom-right-radius:5px}
  .typing{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:none}
  .typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#b8c2d6;margin:0 2px;animation:bl 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
  .quick{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 8px;background:var(--bg)}
  .chip{font-size:12.5px;color:var(--brand);background:#eaf1ff;border:1px solid #d3e2ff;border-radius:999px;padding:7px 12px;cursor:pointer}
  .chip:hover{background:#dceaff}
  .lead{align-self:stretch;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:12px 14px;font-size:13.5px}
  .lead h4{margin:0 0 6px;color:var(--good);font-size:13px}
  .lead .r{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(0,0,0,.05)}
  .lead .r:last-child{border:none}.lead .r span:last-child{font-weight:700}
  .bar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
  .bar input{flex:1;border:1px solid var(--line);border-radius:22px;padding:12px 16px;font-size:14.5px;font-family:inherit}
  .bar input:focus{outline:none;border-color:var(--brand)}
  .bar button{border:none;background:var(--brand);color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
  .bar button:hover{background:#1d4ed8}
  .pw{text-align:center;font-size:11px;color:var(--mut);padding:6px}
</style>
</head>
<body>
<div class="widget">
  <div class="wh">
    <div class="av">💬</div>
    <div><div class="nm" id="biz-name">Bright Smile Dental</div><div class="st"><span class="dot"></span> AI receptionist · replies instantly</div></div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>
  <div class="quick" id="quick"></div>
  <div class="bar">
    <input id="inp" placeholder="Type your message…" onkeydown="if(event.key==='Enter')send()" autocomplete="off" />
    <button onclick="send()">➤</button>
  </div>
  <div class="pw">Powered by Southline AI</div>
</div>

<script>
/* ===========================================================
   Southline AI Receptionist — website chat widget
   Same brain as the phone agent, on the web channel.
   Configure via URL params or the CONFIG object, e.g.:
   chat/?business=Joe%27s%20Plumbing&type=plumber&webhook=https://...
   =========================================================== */
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
const CONFIG={
  business: P.get('business') || 'Bright Smile Dental',
  type:     P.get('type')     || 'dental clinic',
  area:     P.get('area')     || 'Ballsbridge, Dublin',
  hours:    P.get('hours')    || 'Mon-Fri 9am-6pm, Sat 9am-1pm, closed Sunday',
  services: P.get('services') || 'check-ups, cleanings, whitening, Invisalign, emergency dental',
  pricing:  P.get('pricing')  || 'Check-up & clean €65. New patients welcome.',
  faq:      P.get('faq')      || 'We are on Merrion Road with parking. We take card, cash and the main insurers.',
  webhook:  P.get('webhook')  || ''
};
$('biz-name').textContent=CONFIG.business;

const st={have:{name:'',phone:'',reason:'',time:''},asked:null,booking:false,pending:false,turns:0,done:false};

/* ---- intent detection (shared brain) ---- */
function detect(t){
  t=' '+t.toLowerCase()+' '; const has=(...w)=>w.some(x=>t.includes(x));
  if(has('emergency','urgent','severe','really bad','a lot of pain','bleeding','knocked out')) return 'emergency';
  if(has('how much','price','cost','fee','charge','quote')) return 'price';
  if(has('open','hours','close','what time','when are you','sunday','weekend')) return 'hours';
  if(has('pay','card','cash','insurance','insurer','vhi','laya','finance')) return 'payment';
  if(has(' where','located','address','location','parking',' park ','directions')) return 'location';
  if(has('what do you','services','do you do','do you offer','treat','can you')) return 'services';
  if(has('cancel')) return 'cancel';
  if(has('reschedule','change my appointment','move my appointment')) return 'reschedule';
  if(has('book','appointment','schedule','see someone','come in','get in','slot','available')) return 'book';
  if(has('human','real person','speak to','talk to someone','receptionist','call me')) return 'human';
  if(has('thank','thanks','that is all','that\'s all','bye','goodbye','no thanks')) return 'bye';
  if(/\b\d[\d\s]{5,}\b/.test(t)) return 'phone';
  return null;
}
function K(){ return CONFIG; }
function answerFor(i){const k=K();switch(i){
  case 'price': return `${cap(k.pricing)} Would you like me to book you in?`;
  case 'hours': return `Our hours are ${k.hours}. Want me to find you a time?`;
  case 'location': return `We're in ${k.area}. ${k.faq} Shall I book you an appointment?`;
  case 'services': return `We do ${k.services}. What are you after?`;
  case 'payment': return `${k.faq} Would you like to book in?`;
  default: return null;
}}
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;

/* ---- UI ---- */
function add(who,text){const m=document.createElement('div');m.className='b '+(who==='ai'?'ai':'me');m.textContent=text;$('msgs').appendChild(m);$('msgs').scrollTop=1e9;}
function quick(opts){$('quick').innerHTML=(opts||[]).map(o=>`<span class="chip" onclick="chip('${o.replace(/'/g,"\\'")}')">${o}</span>`).join('');}
function chip(t){$('inp').value=t;send();}
async function ai(text,opts){
  $('typing').style.display='block';$('quick').innerHTML='';$('msgs').scrollTop=1e9;
  await wait(500+Math.min(text.length*12,900));
  $('typing').style.display='none';add('ai',text);if(opts)quick(opts);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- booking flow ---- */
function nextAsk(){
  if(!st.have.reason) return {k:'reason',q:`Happy to help. What do you need — a check-up, a specific treatment, or something urgent?`};
  if(!st.have.name)   return {k:'name',  q:`Can I take your name?`};
  if(!st.have.phone)  return {k:'phone', q:`Thanks${st.have.name?' '+st.have.name.split(' ')[0]:''}. And the best phone number to reach you on?`};
  if(!st.have.time)   return {k:'time',  q:`Great. What day and time roughly suits you?`};
  return null;
}
async function continueBooking(){
  const n=nextAsk();
  if(n){ st.asked=n.k; await ai(n.q); return; }
  st.asked=null; st.done=true; submitLead();
  await ai(`You're all set${st.have.name?', '+st.have.name.split(' ')[0]:''}! I've sent your details to the team and they'll confirm your appointment shortly. Anything else?`,['No, thanks']);
  showLeadCard();
}

/* ---- main handler ---- */
async function handle(text){
  st.turns++; const i=detect(text); const phoneM=text.match(/\+?\d[\d\s]{5,}\d/);
  // capture
  if(st.asked==='name'){ if(phoneM&&!/[a-z]{2,}/i.test(text)) st.have.phone=phoneM[0].trim(); else st.have.name=clean(text); }
  else if(st.asked==='phone'&&phoneM) st.have.phone=phoneM[0].trim();
  else if(st.asked==='time') st.have.time=text;
  else if(st.asked==='reason') st.have.reason=text;
  if(!st.have.phone&&phoneM&&st.asked!=='name') st.have.phone=phoneM[0].trim();
  if(!st.have.reason&&st.turns===1&&!['price','hours','payment','location'].includes(i)) st.have.reason=text;
  if(!st.have.reason&&['book','emergency','services'].includes(i)) st.have.reason=text;

  if(i==='bye'){ if(st.have.name&&st.have.phone&&!st.done){submitLead();showLeadCard();} return ai(`Thanks for chatting with ${CONFIG.business} — talk soon!`); }
  if(i==='human'){ st.booking=true; if(!st.have.reason)st.have.reason='Asked to speak to the team'; await ai(`Of course — I'll get the team to call you back.`); return continueBooking(); }
  if(i==='emergency'){ st.booking=true; if(!st.have.reason)st.have.reason='Possible emergency'; await ai(`That sounds like it needs urgent attention — let me get your details so the team can call you right away.`); return continueBooking(); }
  if(i==='cancel'||i==='reschedule'){ st.booking=true; if(!st.have.reason)st.have.reason=(i==='cancel'?'Cancellation':'Reschedule'); await ai(`No problem, I can sort that. Let me take your name and number.`); return continueBooking(); }

  if(st.pending){ st.pending=false; if(/^(yes|yeah|yep|sure|please|ok|go on|book)/i.test(text)){ st.booking=true; return continueBooking(); } }

  const known=answerFor(i);
  if(known&&i!=='book'){ st.pending=true; return ai(known,['Yes, book me in','Just a question']); }

  if(i==='book'||st.booking||st.have.reason){ st.booking=true; return continueBooking(); }

  // fallback -> take a message
  st.booking=true; if(!st.have.reason)st.have.reason=text;
  await ai(`Good question — let me take your details and the team will come straight back to you.`);
  return continueBooking();
}
function clean(s){return s.replace(/^(it'?s|i'?m|my name is|this is|i am)\s+/i,'').replace(/[.,!]$/,'').trim().split(/\s+/).slice(0,2).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');}

function submitLead(){
  const lead={business:CONFIG.business,name:st.have.name||'Website visitor',phone:st.have.phone||'',
    reason:st.have.reason||'Website enquiry',preferred_time:st.have.time||'',
    urgency:/emergency|urgent|pain|bleeding/i.test(st.have.reason||'')?'urgent':'normal',
    channel:'web-chat',receivedAt:new Date().toISOString()};
  if(CONFIG.webhook){ fetch(CONFIG.webhook+'/log-lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)}).catch(()=>{}); }
  window.__lead=lead;
}
function showLeadCard(){
  const l=window.__lead||{};const c=document.createElement('div');c.className='lead';
  c.innerHTML=`<h4>✅ Sent to ${CONFIG.business}</h4>
    <div class="r"><span>Name</span><span>${esc(l.name)}</span></div>
    <div class="r"><span>Phone</span><span>${esc(l.phone||'—')}</span></div>
    <div class="r"><span>Reason</span><span>${esc(l.reason)}</span></div>
    ${l.preferred_time?`<div class="r"><span>When</span><span>${esc(l.preferred_time)}</span></div>`:''}`;
  $('msgs').appendChild(c);$('msgs').scrollTop=1e9;
}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

async function send(){const v=$('inp').value.trim();if(!v)return;$('inp').value='';add('me',v);await handle(v);}

/* ---- boot ---- */
(async()=>{
  await ai(`Hi! Thanks for visiting ${CONFIG.business} 👋 How can I help you today?`,
    ['Book an appointment','How much is a check-up?','Are you open Saturday?']);
})();
</script>
</body>
</html>
