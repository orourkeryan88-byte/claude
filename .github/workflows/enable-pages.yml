name: Enable GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/enable-pages.yml']

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Enable GitHub Pages via API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                source: {
                  branch: 'gh-pages',
                  path: '/'
                }
              });
              console.log('GitHub Pages enabled successfully');
            } catch(e) {
              if (e.status === 409) {
                console.log('Pages already exists, updating source...');
                await github.rest.repos.updateInformationAboutPagesSite({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  source: {
                    branch: 'gh-pages',
                    path: '/'
                  }
                });
                console.log('Pages source updated to gh-pages branch');
              } else {
                console.error('Error:', e.message);
                throw e;
              }
            }
