  <!-- Snapback adjuster -->
  <rect x="230" y="448" width="140" height="14" rx="3" fill="#111" stroke="#2a2a28" stroke-width="1"/>
  <rect x="270" y="451" width="60" height="8" rx="2" fill="#1a1a18" stroke="#333" stroke-width="1"/>
  <!-- White RR monogram -->
  <g transform="translate(300,308)">
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="52" fill="#ffffff" transform="translate(-22,-26)">R</text>
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="52" fill="#ffffff" transform="translate(22,-26) scale(-1,1)">R</text>
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="52" fill="#ffffff" transform="translate(-22,26) scale(-1,-1)">R</text>
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="52" fill="#ffffff" transform="translate(22,26) scale(1,-1)">R</text>
  </g>
  <text x="300" y="530" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="13" fill="#f5f5f3" letter-spacing="5">RELIER</text>
