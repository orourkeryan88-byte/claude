  <rect x="105" y="335" width="390" height="8" rx="2" fill="#222221"/>
  <!-- Panel seams -->
  <line x1="300" y1="190" x2="300" y2="452" stroke="#2a2a28" stroke-width="1.5"/>
  <line x1="190" y1="200" x2="155" y2="440" stroke="#2a2a28" stroke-width="1"/>
  <line x1="410" y1="200" x2="445" y2="440" stroke="#2a2a28" stroke-width="1"/>
  <!-- Top button -->
