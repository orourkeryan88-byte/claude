<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#f2f2f0"/>
  <!-- T-shirt body back -->
  <g fill="#ffffff" stroke="#d0d0ce" stroke-width="1.5">
    <polygon points="120,140 190,105 240,170 240,620 360,620 360,170 410,105 480,140 500,220 440,240 440,620 160,620 160,240 100,220" />
    <rect x="240" y="138" width="120" height="32" fill="#f2f2f0" stroke="none"/>
  </g>
  <!-- Back graphic: RELIER text + large monogram -->
  <text x="300" y="300" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#1a1a18" letter-spacing="10">RELIER</text>
  <!-- Large RR monogram centered -->
  <g transform="translate(300,390)">
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="70" fill="#1a1a18" transform="translate(-32,-35)">R</text>
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="70" fill="#1a1a18" transform="translate(32,-35) scale(-1,1)">R</text>
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="70" fill="#1a1a18" transform="translate(-32,35) scale(-1,-1)">R</text>
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="70" fill="#1a1a18" transform="translate(32,35) scale(1,-1)">R</text>
  </g>
  <text x="300" y="680" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="13" fill="#1a1a18" letter-spacing="5">RELIER</text>
  <text x="300" y="700" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#999" letter-spacing="3">WHITE TEE — BACK</text>
  <text x="300" y="720" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#999" letter-spacing="2">£55.00</text>
</svg>