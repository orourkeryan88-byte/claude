<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Background -->
  <rect width="600" height="800" fill="#f0f0ee"/>

  <!-- Cap silhouette (forward-facing 5-panel structured cap) -->
  <!-- Crown panels (dome shape) -->
  <path d="M145,440 Q140,300 300,260 Q460,300 455,440 Z" fill="#9a9a96" stroke="#7e7e7a" stroke-width="1.5"/>

  <!-- Crown panel seam lines (subtle) -->
  <line x1="300" y1="262" x2="300" y2="440" stroke="#7e7e7a" stroke-width="0.8" opacity="0.5"/>
  <line x1="222" y1="288" x2="215" y2="440" stroke="#7e7e7a" stroke-width="0.8" opacity="0.4"/>
  <line x1="378" y1="288" x2="385" y2="440" stroke="#7e7e7a" stroke-width="0.8" opacity="0.4"/>

  <!-- Sweatband / base band -->
  <path d="M145,440 Q300,460 455,440 L460,458 Q300,480 140,458 Z" fill="#7e7e7a"/>

  <!-- Brim (bill) -->
  <path d="M145,448 Q300,472 455,448 Q480,470 460,488 Q300,510 140,488 Q120,470 145,448 Z" fill="#888884" stroke="#6e6e6a" stroke-width="1"/>
  <!-- Brim underside shadow -->
  <path d="M145,458 Q300,480 455,458 Q477,475 460,488 Q300,500 140,488 Q123,475 145,458 Z" fill="#6e6e6a" opacity="0.35"/>

  <!-- Button on top -->
  <circle cx="300" cy="270" r="9" fill="#7e7e7a" stroke="#6e6e6a" stroke-width="1"/>

  <!-- RR Monogram on front panel (CX=300, CY=370) -->
  <!-- Top-left normal R -->
  <text transform="translate(272,342)" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-weight="900" font-size="64" fill="#1a1a18" opacity="0.75">R</text>
  <!-- Top-right mirrored R -->
  <text transform="translate(328,342) scale(-1,1)" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-weight="900" font-size="64" fill="#1a1a18" opacity="0.75">R</text>
  <!-- Bottom-left mirror+flip -->
  <text transform="translate(272,398) scale(-1,-1)" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-weight="900" font-size="64" fill="#1a1a18" opacity="0.75">R</text>
  <!-- Bottom-right flip -->
  <text transform="translate(328,398) scale(1,-1)" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-weight="900" font-size="64" fill="#1a1a18" opacity="0.75">R</text>

  <!-- RELIER wordmark -->
  <text x="300" y="710" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-weight="700" font-size="14" fill="#1a1a18" letter-spacing="6">RELIER</text>

  <!-- Product label -->
  <text x="300" y="740" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="11" fill="#888884" letter-spacing="3">GREY CAP</text>
</svg>
