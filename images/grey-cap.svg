<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#f2f2f0"/>
  <!-- Cap crown (grey front panels) -->
  <ellipse cx="300" cy="320" rx="210" ry="130" fill="#9a9a98"/>
  <!-- White mesh back section -->
  <ellipse cx="300" cy="320" rx="210" ry="130" fill="none" stroke="none"/>
  <path d="M300,190 Q430,200 510,320 Q430,440 300,450 Q170,440 90,320 Q170,200 300,190" fill="#9a9a98"/>
  <!-- Lighter right side (mesh) -->
  <path d="M300,195 Q430,200 510,320 Q430,440 300,450" fill="#d8d8d6"/>
  <!-- Brim -->
  <path d="M90,320 Q120,400 200,420 Q140,380 130,320" fill="#808080" stroke="#707070" stroke-width="1"/>
  <path d="M90,320 Q120,240 200,220 Q140,260 130,320" fill="#808080"/>
  <ellipse cx="160" cy="320" rx="72" ry="100" fill="#878787"/>
  <!-- Cap brim (front) -->
  <path d="M100,340 Q180,480 300,470 Q420,480 500,340 L480,330 Q420,450 300,445 Q180,450 120,330 Z" fill="#707070" stroke="#606060" stroke-width="1"/>
  <!-- Top button -->
  <circle cx="300" cy="196" r="10" fill="#808080" stroke="#707070" stroke-width="1"/>
  <!-- Center panel seam -->
  <line x1="300" y1="196" x2="300" y2="448" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- White RR monogram -->
  <g transform="translate(300,310)">
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="52" fill="#ffffff" transform="translate(-22,-26)">R</text>
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="52" fill="#ffffff" transform="translate(22,-26) scale(-1,1)">R</text>
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="52" fill="#ffffff" transform="translate(-22,26) scale(-1,-1)">R</text>
    <text text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="900" font-size="52" fill="#ffffff" transform="translate(22,26) scale(1,-1)">R</text>
  </g>
  <text x="300" y="540" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="13" fill="#1a1a18" letter-spacing="5">RELIER</text>
  <text x="300" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#999" letter-spacing="3">TRUCKER CAP — GREY</text>
  <text x="300" y="578" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#999" letter-spacing="2">£40.00</text>
</svg>