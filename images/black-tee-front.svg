<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Background -->
  <rect width="600" height="800" fill="#1a1a18"/>

  <!-- T-shirt silhouette (dark charcoal) -->
  <!-- Left sleeve -->
  <polygon points="60,160 130,120 200,200 170,230 130,195 130,340 100,340 100,200" fill="#2e2e2c" stroke="#3a3a38" stroke-width="1.5"/>
  <!-- Right sleeve -->
  <polygon points="540,160 470,120 400,200 430,230 470,195 470,340 500,340 500,200" fill="#2e2e2c" stroke="#3a3a38" stroke-width="1.5"/>
  <!-- Body -->
  <rect x="100" y="195" width="400" height="420" rx="4" fill="#2e2e2c" stroke="#3a3a38" stroke-width="1.5"/>
  <!-- Collar cutout -->
  <ellipse cx="300" cy="175" rx="70" ry="40" fill="#1a1a18"/>

  <!-- RR Monogram centered on chest (CX=300, CY=360) -->
  <!-- Top-left normal R -->
  <text transform="translate(272,332)" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-weight="900" font-size="64" fill="#f0f0ee">R</text>
  <!-- Top-right mirrored R -->
  <text transform="translate(328,332) scale(-1,1)" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-weight="900" font-size="64" fill="#f0f0ee">R</text>
  <!-- Bottom-left mirror+flip -->
  <text transform="translate(272,388) scale(-1,-1)" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-weight="900" font-size="64" fill="#f0f0ee">R</text>
  <!-- Bottom-right flip -->
  <text transform="translate(328,388) scale(1,-1)" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-weight="900" font-size="64" fill="#f0f0ee">R</text>

  <!-- RELIER wordmark -->
  <text x="300" y="710" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-weight="700" font-size="14" fill="#f0f0ee" letter-spacing="6">RELIER</text>

  <!-- Product label -->
  <text x="300" y="740" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="11" fill="#666662" letter-spacing="3">BLACK TEE — FRONT</text>
</svg>
