    <polygon points="120,140 190,105 240,170 240,620 360,620 360,170 410,105 480,140 500,220 440,240 440,620 160,620 160,240 100,220" />
    <ellipse cx="300" cy="148" rx="62" ry="35" fill="#1a1a18" stroke="none"/>
